name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: node --check (構文チェック)
        run: |
          set -e
          for f in $(find js -name "*.js"); do
            echo "checking $f"
            node --check "$f"
          done

      - name: 静的チェック(禁止パターンの検出)
        run: |
          set -e
          echo "-- innerHTML代入の検出 --"
          if grep -RnE 'innerHTML\s*=' js/ index.html; then
            echo "innerHTML への代入が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- outerHTML代入の検出 --"
          if grep -RnE 'outerHTML\s*=' js/ index.html; then
            echo "outerHTML への代入が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- insertAdjacentHTML の検出 --"
          if grep -RnE 'insertAdjacentHTML' js/ index.html; then
            echo "insertAdjacentHTML() の使用が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- srcdoc の検出 --"
          if grep -RnE 'srcdoc' js/ index.html; then
            echo "srcdoc の使用が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- HTML属性形式のインラインイベントハンドラの検出(onclick= 等) --"
          if grep -RnE '\bon[a-z]+\s*=\s*["'"'"']' js/ index.html; then
            echo "HTML属性形式のインラインイベントハンドラが見つかりました。禁止です。"
            exit 1
          fi

          echo "-- setAttribute(\"onXXX\", ...) の検出 --"
          if grep -RnE 'setAttribute\(\s*["'"'"']on' js/ index.html; then
            echo "setAttribute()でのイベントハンドラ属性設定が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- 'inner'+'HTML' 等の連結によるinnerHTML/outerHTML迂回の検出 --"
          if grep -RnE '["'"'"']inner["'"'"']\s*\+|\+\s*["'"'"']HTML["'"'"']' js/ index.html; then
            echo "innerHTML/outerHTMLを文字列連結で組み立てている箇所が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- eval の検出 --"
          if grep -RnE 'eval\(' js/ index.html; then
            echo "eval() の使用が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- new Function の検出 --"
          if grep -RnE 'new Function' js/ index.html; then
            echo "new Function() の使用が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- document.write の検出 --"
          if grep -RnE 'document\.write' js/ index.html; then
            echo "document.write() の使用が見つかりました。禁止です。"
            exit 1
          fi

          echo "-- 外部URLの検出(js/ と index.html 内。許可はURL単位で、SVG名前空間と下記の外部リンク先だけ) --"
          # 許可するURL（ファイル名:行番号:URL の形で1件ずつ照合。同じファイルに別のURLを足すとCIが落ちる）:
          #   - dom.js の SVG 名前空間 http://www.w3.org/2000/svg（ネットワークアクセスなし）
          #   - external-links.js の出典サイトトップ https://ssbu-shiratsuki-theory.net/ と
          #     プライバシーポリシー https://github.com/Ryoseiimai/aishonote/blob/main/docs/privacy.md
          #   - presets/matchup-reference.js・presets/matchup-links.js の相性表ページ https://ssbu-shiratsuki-theory.net/matchup/<slug>.html
          #   - presets/ssbu-curriculum.js の初心者向け上達カリキュラムの出典URL(sources/settings)。docs/beginner-curriculum.json と同じ固定リスト。
          #   - presets/ssbu-char-curriculum.js のキャラ別出典183 URL。調査済みbatch-1〜6の固定URLのみ（追加時は個別確認）。
          # いずれも fetch/script/style/font として読み込まれることはなく、外部リンク(rel=noopener noreferrer)の宛先になるだけ。
          if grep -RnoE 'https?://[^"'"'"'`[:space:]]*' js/ index.html \
            | grep -vE '^js/dom\.js:[0-9]+:http://www\.w3\.org/2000/svg$' \
            | grep -vE '^js/external-links\.js:[0-9]+:(https://ssbu-shiratsuki-theory\.net/|https://github\.com/Ryoseiimai/aishonote/blob/main/docs/privacy\.md)$' \
            | grep -vE '^js/presets/matchup-(reference|links)\.js:[0-9]+:https://ssbu-shiratsuki-theory\.net/matchup/[a-z0-9_]+\.html$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://game8\.jp/(smashbros-special/223431|smashbros-special/223432|smashbros-special/223433|smashbros-special/223434|smashbros-special/223435|smashbros-special/223436|smashbros-special/223437|smashbros-special/223438|smashbros-special/223439|smashbros-special/223440|smashbros-special/223441|smashbros-special/223442)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://game8\.jp/(smashbros-special/223443|smashbros-special/223444|smashbros-special/223445|smashbros-special/223446|smashbros-special/223447|smashbros-special/223448|smashbros-special/223451|smashbros-special/223452|smashbros-special/223453|smashbros-special/223454|smashbros-special/223455|smashbros-special/223456)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://game8\.jp/(smashbros-special/223458|smashbros-special/223459|smashbros-special/223460|smashbros-special/223461|smashbros-special/223462|smashbros-special/223463|smashbros-special/223478|smashbros-special/223479|smashbros-special/223480|smashbros-special/223481|smashbros-special/223482|smashbros-special/223483)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://game8\.jp/(smashbros-special/223484|smashbros-special/223485|smashbros-special/223486|smashbros-special/223487|smashbros-special/223488|smashbros-special/223489|smashbros-special/223490|smashbros-special/223491|smashbros-special/223492|smashbros-special/223682|smashbros-special/223748|smashbros-special/224349)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://game8\.jp/(smashbros-special/224350|smashbros-special/224351|smashbros-special/231547|smashbros-special/231577|smashbros-special/231578|smashbros-special/231579|smashbros-special/231580|smashbros-special/236549|smashbros-special/241123|smashbros-special/241124|smashbros-special/241125)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://gamerch\.com/(smashbros/122706|smashbros/140073|smashbros/189839|smashbros/207415|smashbros/226196|smashbros/264430|smashbros/292187|smashbros/58080|smashbros/59223|smashbros/59284|smashbros/78840|smashbros/78843)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://gamerch\.com/(smashbros/96873)$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://smashwiki\.info/(しずえ_\(SP\)|インクリング_\(SP\)|インクリング_\(SP\)/ワザ|カムイ_\(SP\)|ガオガエン_\(SP\)|キングクルール_\(SP\)|クッパJr\._\(SP\)|クラウド_\(SP\)|クラウド_\(SP\)/ワザ|ケン_\(SP\)|シモン_\(SP\)|ダックハント_\(SP\))$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://smashwiki\.info/(パックンフラワー_\(SP\)|パックンフラワー_\(SP\)/ワザ|ベヨネッタ_\(SP\)|リドリー_\(SP\)|リヒター_\(SP\)|リュウ_\(SP\))$' \
            | grep -vE '^js/presets/ssbu-char-curriculum\.js:[0-9]+:https://wikiwiki\.jp/(ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%80%E3%82%89%E3%81%B3%E3%81%A8|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%A2%E3%82%A4%E3%82%AF/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%A6%E3%83%AB%E3%83%95|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%B2%E3%83%83%E3%82%B3%E3%82%A6%E3%82%AC|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%B7%E3%83%A5%E3%83%AB%E3%82%AF|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%B9%E3%83%8D%E3%83%BC%E3%82%AF/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%BC%E3%83%AD%E3%82%B9%E3%83%BC%E3%83%84%E3%82%B5%E3%83%A0%E3%82%B9/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%82%BD%E3%83%8B%E3%83%83%E3%82%AF/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%83%87%E3%82%A3%E3%83%87%E3%82%A3%E3%83%BC%E3%82%B3%E3%83%B3%E3%82%B0/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%83%87%E3%83%87%E3%83%87/%E6%94%BB%E7%95%A5|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3%E3%83%AA%E3%83%B3%E3%82%AF|ssbswitch/%E3%83%95%E3%82%A1%E3%82%A4%E3%82%BF%E3%83%BC/%E3%83%91%E3%83%83%E3%82%AF%E3%83%9E%E3%83%B3)$' \
